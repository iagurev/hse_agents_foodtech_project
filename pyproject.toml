[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nutrition-assistant"
version = "0.1.0"
description = "Диалоговый ассистент для питания, рецептов и покупок"
requires-python = ">=3.12"
dependencies = [
  "pydantic-ai-slim[openrouter]==1.68.0",
  "genai-prices==0.0.73",
  "pydantic-settings>=2.10,<3",
  "aiosqlite>=0.21,<1",
  "httpx>=0.28,<1",
  "loguru>=0.7,<1",
  "tokenizers>=0.22,<0.24",
  "jinja2>=3.1,<4",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "argon2-cffi>=23,<26",
  "mcp==1.30.0",
  "tiktoken>=0.12,<1",
  "fastembed>=0.7,<0.8",
  "pymorphy3>=2,<3",
  "truststore>=0.10,<0.11",
  "langfuse>=3.15,<4",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12,<1"]

[project.scripts]
meal-rag = "app.retrieval.__main__:main"
meal-app = "app.web.server:main"
nutrition-assistant = "app.assistant.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]


[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
