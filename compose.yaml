name: k-stolu
services:
  app:
    build: .
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    env_file:
      - path: .env
        required: false
    environment:
      WEB_HOST: 0.0.0.0
      WEB_PORT: 8080
      DATABASE_PATH: /runtime/assistant.sqlite
      RECIPES_DATABASE_PATH: /app/data/recipes.sqlite
      PRODUCTS_DATABASE_PATH: /app/data/products.sqlite
      SOURCES_DATABASE_PATH: /app/data/sources.sqlite
      RETRIEVAL_CACHE_PATH: /runtime/retrieval
      RETRIEVAL_MODEL_CACHE_PATH: /runtime/retrieval-model
      FRONTEND_PATH: /app/frontend/dist
      LANGFUSE_BASE_URL: ${LANGFUSE_DOCKER_URL:-http://host.docker.internal:3001}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data:ro
      - runtime:/runtime
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=5)"]
      interval: 15s
      timeout: 6s
      start_period: 180s
      retries: 5
volumes:
  runtime:
